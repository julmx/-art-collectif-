# Essais locaux uniquement. DOMAIN est un nom DNS local ou une adresse IP, sans port.
services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${DOMAIN:?DOMAIN required}:8443
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH required}
      CODE_REVISION: ${CODE_REVISION:?CODE_REVISION required}
    volumes:
      - nas_art_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    ports:
      - "${LAN_BIND_IP:?LAN_BIND_IP required}:8443:443"
    volumes:
      - ./Caddyfile.nas:/etc/caddy/Caddyfile:ro
      - nas_caddy_data:/data
      - nas_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  nas_art_data:
  nas_caddy_data:
  nas_caddy_config:
