services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_ORIGIN: https://${DOMAIN:?DOMAIN required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH required}
      CODE_REVISION: ${CODE_REVISION:?CODE_REVISION required}
    volumes:
      - art_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1500m
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  art_data:
  caddy_data:
  caddy_config:
